function typeWriter(element, text, speed = 35, callback) {
  let i = 0;
  element.innerHTML = '<span></span><span class="typing-cursor"></span>';

  const textSpan = element.querySelector("span");
  const cursor = element.querySelector(".typing-cursor");

  const timer = setInterval(() => {
    textSpan.innerHTML += text.charAt(i);
    i++;

    if (i >= text.length) {
      clearInterval(timer);
      cursor.remove();
      if (callback) callback();
    }
  }, speed);
}

    if (noBtn) {
      noBtn.style.opacity = "0";
      setTimeout(() => noBtn.remove(), 400);
    }

    const videoOverlay = document.getElementById("videoOverlay");
    const video = document.getElementById("noVideo");

    if (videoOverlay && video) {
      videoOverlay.classList.add("show");
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";


      video.muted = true;        // important for mobile
      video.playsInline = true;  // iOS fix
      video.currentTime = 0;

      video.play().catch(err => {
        console.log("Video play blocked:", err);
      });


      video.onended = () => {
        videoOverlay.classList.remove("show");
        document.documentElement.style.overflow = "";
        document.body.style.overflow = "";


        const overlay = document.getElementById("photoOverlay");
        const overlayImg = document.getElementById("overlayImage");

        if (overlay && overlayImg) {
          overlayImg.src = finalNoImage;
          overlay.classList.add("show");
          setTimeout(() => overlay.classList.remove("show"), 2500);
        }
      };
    }
  }
}
