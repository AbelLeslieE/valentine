function typeWriter(element, text, speed = 35, callback) {
  let i = 0;
  element.innerHTML = '<span></span><span class="typing-cursor"></span>';

  const textSpan = element.querySelector("span");
  const cursor = element.querySelector(".typing-cursor");

  const timer = setInterval(() => {
    textSpan.innerHTML += text.charAt(i);
    i++;

    if (i >= text.length) {
      clearInterval(timer);
      cursor.remove();
      if (callback) callback();
    }
  }, speed);
}

function noClicked() {
  if (noMoves >= maxNoClicks) return;
  const card = document.querySelector(".card");
  const noBtn = document.querySelector(".no");
  const yesBtn = document.querySelector(".yes");
  const question = document.getElementById("mainQuestion");

  /* 🤭 Shake card */
  if (card) {
    card.classList.add("shake");
    setTimeout(() => card.classList.remove("shake"), 300);
  }

  /* ✍️ Change text */
  if (question) {
    const msg = noMessages[Math.min(noMoves, noMessages.length - 1)];
    typeWriter(question, msg, 45);
  }

  /* 💓 Grow YES button */
  if (yesBtn) {
    yesScale = Math.min(yesScale + 0.25, 2.4);
    yesBtn.style.transition = "transform 0.45s cubic-bezier(.22,.61,.36,1)";
    yesBtn.style.transform = `scale(${yesScale})`;
  }

  /* 🏃 Move NO button */
  noMoves++;
  const container = document.getElementById("reactionContainer");
  const bunny = document.getElementById("mainBunny");

  const reactionGifs = [
    "first_no.gif",
    "no2.gif",
    "no3.gif",
    "no4.gif",
    "no5.gif",
    "final_no.gif",
  ];

  // Remove bunny after first NO
  if (noMoves === 1 && bunny) {
    bunny.style.display = "none";
  }

  if (container) {
    let gifIndex;

    // Last NO → show final gif
    if (noMoves >= maxNoClicks) {
      gifIndex = reactionGifs.length - 1;
    } else {
      gifIndex = Math.min(noMoves - 1, reactionGifs.length - 2);
    }

    container.innerHTML = `
      <img src="${reactionGifs[gifIndex]}?${Date.now()}" 
          style="width:130px; display:block; margin:0 auto;">
    `;
  }

  if (noBtn) {
    noBtn.style.transition = "transform 0.35s ease-out";
    noBtn.style.transform = `
      translate(${Math.sin(noMoves) * 18}px, ${Math.cos(noMoves) * 12}px)
    `;
  }

  /* 🎥 Last NO → play video */
  if (noMoves === maxNoClicks) {

    if (noBtn) {
      noBtn.style.opacity = "0";
      setTimeout(() => noBtn.remove(), 400);
    }

    const videoOverlay = document.getElementById("videoOverlay");
    const video = document.getElementById("noVideo");

    if (videoOverlay && video) {
      videoOverlay.classList.add("show");
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";


      video.muted = true;        // important for mobile
      video.playsInline = true;  // iOS fix
      video.currentTime = 0;

      video.play().catch(err => {
        console.log("Video play blocked:", err);
      });


      video.onended = () => {
        videoOverlay.classList.remove("show");
        document.documentElement.style.overflow = "";
        document.body.style.overflow = "";

      };
    }
  }
}

function startDivineDust() {
  const container = document.getElementById("verseCard");
  if (!container) return;

  let count = 0;

  const interval = setInterval(() => {
    // Stop after 20 particles (performance control)
    if (count >= 20) {
      clearInterval(interval);
      return;
    }

    count++;

    const dust = document.createElement("div");
    dust.className = "divine-dust";
    dust.style.left = Math.random() * 100 + "%";
    dust.style.bottom = "0px";
    dust.style.animationDuration = (4 + Math.random() * 4) + "s";

    container.appendChild(dust);

    setTimeout(() => {
      dust.remove();
    }, 8000);

  }, 1000); // slower interval = smoother performance

  // Save so it can be cleared later
  window.divineDustInterval = interval;
}
