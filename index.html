/* ===== APPLE-STYLE PARALLAX ===== */

let parallaxEnabled = false;

function enableParallax() {
  parallaxEnabled = true;
}

function disableParallax() {
  parallaxEnabled = false;
}

/* Desktop mouse parallax */
document.addEventListener("mousemove", (e) => {
  if (!parallaxEnabled) return;

  const content = document.getElementById("mainContent");
  const card = document.querySelector(".card");

  if (!content || !card) return;

  const x = (e.clientX / window.innerWidth - 0.5);
  const y = (e.clientY / window.innerHeight - 0.5);

  /* Slower, subtle Apple-style movement */
  const moveX = x * 8;
  const moveY = y * 8;

  content.style.transform = `
    translate(${moveX}px, ${moveY}px)
  `;

  card.style.transform = `
    rotateY(${x * 2.5}deg)
    rotateX(${-y * 2.5}deg)
    translateZ(10px)
  `;
});

function playDisc(index, element) {
  // Stop previous
  if (currentAudio) {
    currentAudio.pause();
  }

  if (currentDisc) {
    currentDisc.classList.remove("spin", "active-disc");
  }

  // New audio
  currentAudio = new Audio(musicList[index].file);
  currentAudio.volume = 0.9;
  currentAudio.play().catch(() => {});


  // Animate disc
  element.classList.add("spin", "active-disc");
  currentDisc = element;

  // Auto stop animation when finished
  currentAudio.onended = () => {
    element.classList.remove("spin", "active-disc");
  };
}
function pauseMusic() {
  if (currentAudio) {
    currentAudio.pause();
  }
  if (currentDisc) {
    currentDisc.classList.remove("spin", "active-disc");
  }
}
function closeMusicRoom() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  if (currentDisc) {
    currentDisc.classList.remove("spin", "active-disc");
    currentDisc = null;
  }

  const room = document.getElementById("musicRoom");
  if (room) room.remove();
}

function openMusicRoom() {
  const room = document.createElement("div");
  room.id = "musicRoom";

  let discsHTML = "";

  musicList.forEach((song, index) => {
    discsHTML += `

  room.innerHTML = `

      <div style="margin-top:30px;">

  `;

  document.body.appendChild(room);

function typeWriter(element, text, speed = 35, callback) {
  let i = 0;
  element.innerHTML = '<span></span><span class="typing-cursor"></span>';

  const textSpan = element.querySelector("span");
  const cursor = element.querySelector(".typing-cursor");

  const timer = setInterval(() => {
    textSpan.innerHTML += text.charAt(i);
    i++;

    if (i >= text.length) {
      clearInterval(timer);
      cursor.remove();
      if (callback) callback();
    }
  }, speed);
}

function startDivineDust() {

    count++;

    const dust = document.createElement("div");
    dust.className = "divine-dust";
    dust.style.left = Math.random() * 100 + "%";
    dust.style.bottom = "0px";
    dust.style.animationDuration = (4 + Math.random() * 4) + "s";

    container.appendChild(dust);

    setTimeout(() => {
      dust.remove();

  }, 1000); // slower interval = smoother performance

  // Save so it can be cleared later
  window.divineDustInterval = interval;
