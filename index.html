  }

  // New audio
  currentAudio = new Audio(musicList[index].file);
  currentAudio.volume = 0.9;
  currentAudio.play().catch(() => {});


  // Animate disc
  element.classList.add("spin", "active-disc");
  currentDisc = element;

  // Auto stop animation when finished
  currentAudio.onended = () => {
    element.classList.remove("spin", "active-disc");
  };
}

function typeWriter(element, text, speed = 35, callback) {
  let i = 0;
  element.innerHTML = '<span></span><span class="typing-cursor"></span>';

  const textSpan = element.querySelector("span");
  const cursor = element.querySelector(".typing-cursor");

  const timer = setInterval(() => {
    textSpan.innerHTML += text.charAt(i);
    i++;

    if (i >= text.length) {
      clearInterval(timer);
      cursor.remove();
      if (callback) callback();
    }
  }, speed);
}
